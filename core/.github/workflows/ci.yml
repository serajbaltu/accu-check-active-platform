name: CI Checks
on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Instala as dependências
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            - name: Lint (ruff)
              run: python -m ruff check src tests tools
            - name: Testes unitários
              run: python -m pytest tests/ -v
            - name: Gera o relatório a partir do dataset sintético
              run: |
                  python -m src.cli report \
                    --data examples/data_sintetico.json \
                    --out relatorio-exemplo.html
                  test -s relatorio-exemplo.html
